apiVersion: batch/v1
kind: Job
metadata:
  name: document-service-migrations
  namespace: document-service
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-service-migrations
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgresql 5432; do sleep 2; done"]
      containers:
        - name: migrations
          image: projeto-nest:latest
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "migration:run:prod"]
          envFrom:
            - configMapRef:
                name: document-service-config
            - secretRef:
                name: document-service-secret
