apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-extraction-worker
  namespace: document-service
  labels:
    app.kubernetes.io/name: document-extraction-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: document-extraction-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-extraction-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgresql 5432; do sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka-1 19092 && nc -z kafka-2 19092; do sleep 2; done"]
      containers:
        - name: worker
          image: projeto-nest:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/worker.js"]
          envFrom:
            - configMapRef:
                name: document-service-config
            - secretRef:
                name: document-service-secret
          env:
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
