apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: document-extraction-worker
  namespace: document-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: document-extraction-worker
  minReplicas: 3
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
