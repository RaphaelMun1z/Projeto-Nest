apiVersion: v1
kind: Service
metadata:
  name: kafka-1
  namespace: document-service
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka-1
  ports:
    - name: kafka
      port: 19092
      targetPort: kafka
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-1
  namespace: document-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-1
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.12
          ports:
            - name: kafka
              containerPort: 19092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-1:9093,2@kafka-2:9093
            - name: KAFKA_LISTENERS
              value: INTERNAL://:19092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://kafka-1:19092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "2"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_LOG_RETENTION_MS
              value: "604800000"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "1073741824"
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: kafka-data
              mountPath: /bitnami/kafka
      volumes:
        - name: kafka-data
          emptyDir: {}
---
