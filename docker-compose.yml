services:
    db-documents-postgres:
        image: postgres:17
        container_name: db-documents-postgres
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: db-documents
        volumes:
            - db-data:/var/lib/postgresql/data

volumes:
    db-data:
