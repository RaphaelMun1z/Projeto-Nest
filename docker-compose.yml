name: document-service

services:
    database:
        image: postgres:17
        container_name: document-service-database
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: db-documents
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d db-documents']
            interval: 5s
            timeout: 5s
            retries: 10

    kafka-1:
        image: confluentinc/cp-kafka:7.6.12
        container_name: document-service-kafka-1
        hostname: kafka-1
        ports:
            - '9092:9092'
        environment:
            KAFKA_NODE_ID: 1
            CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093
            KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
            KAFKA_DEFAULT_REPLICATION_FACTOR: 2
            KAFKA_MIN_INSYNC_REPLICAS: 2
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_LOG_RETENTION_MS: ${KAFKA_LOG_RETENTION_MS:-604800000}
            KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
            KAFKA_LOG_SEGMENT_MS: ${KAFKA_LOG_SEGMENT_MS:-86400000}
            KAFKA_LOG_CLEANUP_POLICY: delete
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
            KAFKA_LOG_DIRS: /var/lib/kafka/data
            KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
        volumes:
            - kafka-1-data:/var/lib/kafka/data

    kafka-2:
        image: confluentinc/cp-kafka:7.6.12
        container_name: document-service-kafka-2
        hostname: kafka-2
        ports:
            - '9094:9094'
        environment:
            KAFKA_NODE_ID: 2
            CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093
            KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9094,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9094
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
            KAFKA_DEFAULT_REPLICATION_FACTOR: 2
            KAFKA_MIN_INSYNC_REPLICAS: 2
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_LOG_RETENTION_MS: ${KAFKA_LOG_RETENTION_MS:-604800000}
            KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
            KAFKA_LOG_SEGMENT_MS: ${KAFKA_LOG_SEGMENT_MS:-86400000}
            KAFKA_LOG_CLEANUP_POLICY: delete
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
            KAFKA_LOG_DIRS: /var/lib/kafka/data
            KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
        volumes:
            - kafka-2-data:/var/lib/kafka/data

    kafka-init:
        image: confluentinc/cp-kafka:7.6.12
        container_name: document-service-kafka-init
        depends_on:
            - kafka-1
            - kafka-2
        entrypoint: /bin/bash
        command:
            - -c
            - |
                until kafka-topics --bootstrap-server kafka-1:19092 --list >/dev/null 2>&1; do sleep 3; done
                kafka-topics --bootstrap-server kafka-1:19092 --create --if-not-exists --topic document.extracted.v1 --partitions 3 --replication-factor 2 --config retention.ms=$${KAFKA_LOG_RETENTION_MS:-604800000} --config retention.bytes=$${KAFKA_LOG_RETENTION_BYTES:-1073741824}
                kafka-topics --bootstrap-server kafka-1:19092 --create --if-not-exists --topic document.extracted.v1.DLT --partitions 3 --replication-factor 2 --config retention.ms=$${KAFKA_LOG_RETENTION_MS:-604800000} --config retention.bytes=$${KAFKA_LOG_RETENTION_BYTES:-1073741824}

    backend:
        build:
            context: .
        container_name: document-service-backend
        ports:
            - '3000:3000'
        environment:
            NODE_ENV: production
            PORT: 3000
            MAX_PDF_SIZE_BYTES: ${MAX_PDF_SIZE_BYTES:-10485760}
            DB_HOST: database
            DB_PORT: 5432
            DB_USERNAME: postgres
            DB_PASSWORD: postgres
            DB_NAME: db-documents
            KAFKA_BROKERS: kafka-1:19092,kafka-2:19092
            KAFKA_CLIENT_ID: document-service
            KAFKA_DOCUMENT_TOPIC: document.extracted.v1
        depends_on:
            database:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
        restart: unless-stopped

volumes:
    db-data:
    kafka-1-data:
    kafka-2-data:
